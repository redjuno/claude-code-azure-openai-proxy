# Claude Code tier -> Azure OpenAI deployment.
# Placeholders are filled by scripts/start-proxy.sh from .env.
#
# The azure/responses/ prefix routes through Azure's /v1/responses endpoint.
# /v1/chat/completions rejects function tools while reasoning is on
# ("Function tools with reasoning_effort are not supported"), and LiteLLM only
# bridges to /responses on its own for deployment names it recognises as
# gpt-5.4+, which these are not.
model_list:
  - model_name: __CLAUDE_CODE_OPUS_ALIAS__
    litellm_params:
      model: azure/responses/__AZURE_DEPLOYMENT_OPUS__
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      # base_model must be a model LiteLLM knows, otherwise it sends max_tokens
      # instead of max_completion_tokens and Azure rejects the request.
      base_model: azure/gpt-5

  - model_name: __CLAUDE_CODE_FABLE_ALIAS__
    litellm_params:
      model: azure/responses/__AZURE_DEPLOYMENT_FABLE__
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      base_model: azure/gpt-5

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
